; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = COM5
lib_deps = 
	heltecautomation/Heltec ESP32 Dev-Boards @ ^1.1.1
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
	adafruit/Adafruit AS726x @ ^1.0.5
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BusIO@^1.17.2
	sparkfun/SparkFun BMI270 Arduino Library
	adafruit/Adafruit BusIO
	adafruit/Adafruit Unified Sensor
	knolleary/PubSubClient@^2.8.0
build_flags = 
	-I"$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src"
