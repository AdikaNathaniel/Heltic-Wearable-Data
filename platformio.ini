[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = COM5

lib_deps =
    heltecautomation/Heltec ESP32 Dev-Boards @ ^1.1.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    adafruit/Adafruit AS726x @ ^1.0.5

; 👇 force compiler to see SPI.h in Arduino core
build_flags =
    -I"$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src"
